<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://script.google.com https://script.googleusercontent.com; base-uri 'none'; form-action 'none'; object-src 'none'">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="theme-color" content="#FFFFFF">
<title>הזמנת שיעור</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#FFFFFF;--soft:#F5F6F8;--line:#E6E8EC;--text:#16181D;--sub:#5F6672;--mute:#9AA0AA;--acc:#2F5BD8;--acc-bg:#EEF3FF;--ok:#1F8A5B}
body{font-family:'Rubik',system-ui,sans-serif;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;line-height:1.5}
button,input,textarea{font-family:inherit;color:inherit}
button{cursor:pointer;background:none;border:none}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px;border-radius:8px}
.page{max-width:480px;margin:0 auto;padding:40px 20px 48px}
.top{text-align:center;margin-bottom:34px}
.av{width:64px;height:64px;border-radius:50%;background:var(--acc-bg);color:var(--acc);display:grid;place-items:center;font-weight:700;font-size:1.5rem;margin:0 auto 12px}
.top h1{font-size:1.6rem;font-weight:700;letter-spacing:-.01em}
.top p{color:var(--sub);font-size:.95rem;margin-top:2px}
.sec{margin-bottom:28px}
.sec h2{font-size:.95rem;font-weight:600;margin-bottom:10px;display:flex;justify-content:space-between;align-items:baseline}
.sec h2 small{font-weight:400;color:var(--mute);font-size:.82rem}
.seg{display:flex;background:var(--soft);border-radius:12px;padding:4px;gap:4px}
.seg button{flex:1;padding:10px 6px;border-radius:9px;font-size:.9rem;font-weight:500;color:var(--sub);transition:.15s}
.seg button.on{background:#fff;color:var(--text);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.1)}
.row{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 6px;scroll-snap-type:x mandatory;scrollbar-width:none}
.row::-webkit-scrollbar{display:none}
.date{flex:0 0 64px;scroll-snap-align:start;border:1.5px solid var(--line);border-radius:14px;padding:8px 0;text-align:center;transition:.15s}
.date .wd{display:block;font-size:.72rem;color:var(--mute)}
.date .dn{display:block;font-size:1.3rem;font-weight:700;line-height:1.2}
.date .mo{display:block;font-size:.7rem;color:var(--sub)}
.date .fr{display:none}
.date.on{border-color:var(--acc);background:var(--acc);color:#fff}
.date.on .wd,.date.on .mo{color:rgba(255,255,255,.8)}
.times{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.tgroup h3{display:none}
.tgroup+.tgroup{margin-top:8px}
.time{border:1.5px solid var(--line);border-radius:10px;padding:9px 0;font-weight:500;font-variant-numeric:tabular-nums;transition:.15s}
.time.on{border-color:var(--acc);background:var(--acc-bg);color:var(--acc);font-weight:600}
.placeholder{color:var(--mute);font-size:.88rem}
.inp{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;font-size:1rem;outline:none;background:#fff;transition:border-color .15s}
.inp:focus{border-color:var(--acc)}
.inp::placeholder{color:var(--mute)}
textarea.inp{resize:none}
.stack{display:flex;flex-direction:column;gap:10px}
.hp{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap;opacity:0;pointer-events:none}
.sum{text-align:center;font-size:.88rem;color:var(--sub);margin-bottom:10px;min-height:1.3em}
.sum b{color:var(--text);font-weight:600}
.send{width:100%;background:var(--acc);color:#fff;border-radius:14px;padding:15px;font-size:1rem;font-weight:600;transition:.15s;display:flex;justify-content:center;align-items:center;gap:8px}
.send:hover{background:#2248B8}
.send.wa{background:#1FA855}
.send[disabled]{opacity:.6;pointer-events:none}
.foot{text-align:center;color:var(--mute);font-size:.8rem;margin-top:16px}
.empty{text-align:center;padding:30px 10px;color:var(--sub);line-height:1.7}
.empty .big{font-weight:600;color:var(--text);font-size:1.05rem}
.spin{width:24px;height:24px;border:2.5px solid var(--line);border-top-color:var(--acc);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 10px}
.spin.sm{width:16px;height:16px;border-width:2px;border-color:rgba(255,255,255,.4);border-top-color:#fff;margin:0;display:inline-block}
.ovl{position:fixed;inset:0;background:rgba(22,24,29,.45);z-index:100;display:flex;align-items:flex-end;justify-content:center;opacity:0;pointer-events:none;transition:opacity .2s}
.ovl.open{opacity:1;pointer-events:auto}
.modal{background:#fff;border-radius:22px 22px 0 0;padding:26px 22px 22px;width:100%;max-width:480px;text-align:center;max-height:90vh;overflow:auto;transform:translateY(30px);transition:transform .25s}
.ovl.open .modal{transform:none}
@media (min-width:560px){.ovl{align-items:center}.modal{border-radius:22px}}
.badge{width:56px;height:56px;border-radius:50%;margin:0 auto 10px;display:grid;place-items:center;font-size:1.5rem}
.badge.ok{background:#E8F5EE;color:var(--ok)}
.badge.ok svg{width:30px;height:30px}
.badge.err{background:#FDECEC}
.modal h3{font-size:1.25rem;font-weight:700}
.modal p{color:var(--sub);font-size:.9rem;margin-top:4px}
.ticket{background:var(--soft);border-radius:12px;padding:12px 14px;margin:16px 0 4px;text-align:right;display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:.9rem}
.ticket dt{color:var(--mute)}
.ticket dd{font-weight:500}
.mbtn{display:block;width:100%;border-radius:12px;padding:13px;font-size:.95rem;font-weight:600;margin-top:8px;text-decoration:none;border:1.5px solid var(--line);background:#fff;text-align:center}
.mbtn.pri{background:var(--text);border-color:var(--text);color:#fff}
.mbtn.wa{background:#1FA855;border-color:#1FA855;color:#fff}
#toast{position:fixed;top:14px;left:50%;transform:translate(-50%,-16px);background:var(--text);color:#fff;padding:10px 18px;border-radius:12px;font-size:.88rem;z-index:999;opacity:0;transition:.25s;pointer-events:none;max-width:92vw;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="toast" role="status" aria-live="polite"></div>
<main class="page">
 <div class="top"><div class="av" id="t-av">·</div><h1 id="t-name">הזמנת שיעור</h1><p id="t-bio">שיעורים פרטיים בערבית ובעברית</p></div>
 <div id="content"><div class="empty"><div class="spin"></div>טוען שעות פנויות…</div></div>
 <p class="foot">האישור הסופי יגיע אליך בוואטסאפ</p>
</main>
<div class="ovl" id="ovl"><div class="modal" id="modal" role="dialog" aria-modal="true"></div></div>

<script>
'use strict';
const LANGS=[
 {name:'ערבית מדוברת',code:'a',sample:'كيفك؟',cls:'ar'},
 {name:'ערבית ספרותית',code:'f',sample:'كيف حالك؟',cls:'ar'},
 {name:'עברית',code:'h',sample:'מה שלומך?',cls:'he'}];
const LANG_CODE=Object.fromEntries(LANGS.map(l=>[l.name,l.code]));
const DAYS=['ראשון','שני','שלישי','רביעי','חמישי','שישי','שבת'];
const MONTHS=['ינואר','פברואר','מרץ','אפריל','מאי','יוני','יולי','אוגוסט','ספטמבר','אוקטובר','נובמבר','דצמבר'];
const BOOK_RE=/^https:\/\/script\.google\.com\/macros\/s\/[\w-]+\/exec$/;
const ERR={
 rate_limited:'נשלחו כבר כמה בקשות מהמספר הזה בשעה האחרונה. אפשר לנסות שוב מאוחר יותר.',
 slot_unavailable:'השעה הזאת כבר לא פנויה. בחר שעה אחרת.',
 slot_pending:'מישהו אחר ביקש את השעה הזאת ממש עכשיו. בחר שעה אחרת.',
 bad_name:'נא להזין שם מלא',bad_phone:'נא להזין מספר טלפון תקין',bad_lang:'נא לבחור שפה',bad_slot:'נא לבחור תאריך ושעה'
};
const $=s=>document.querySelector(s);
const esc=v=>String(v??'').replace(/[&<>"'`]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;','`':'&#96;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const dkey=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x;};
const parseKey=k=>{const [y,m,d]=k.split('-').map(Number);return new Date(y,m-1,d,12);};
const fmtD=k=>{const d=parseKey(k);return d.getDate()+'/'+(d.getMonth()+1)+'/'+d.getFullYear();};
const dayLabel=k=>{const x=parseKey(k);return `יום ${DAYS[x.getDay()]} ${fmtD(k)}`;};
let _t;function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(_t);_t=setTimeout(()=>t.classList.remove('show'),3400);}

let AV=null,selLang='',selDate='',selTime='',sending=false;

async function load(keepForm){
 try{const r=await fetch('availability.json?t='+Date.now(),{cache:'no-store'});if(!r.ok)throw new Error();AV=await r.json();}
 catch(e){if(!keepForm)$('#content').innerHTML='<div class="empty"><div class="big">לא הצלחנו לטעון את השעות</div>רענן את הדף בעוד רגע.</div>';return;}
 renderHero();renderForm(keepForm);
}
const teacher=()=>(AV&&AV.teacher)||{};
const waNumber=()=>{const n=String(teacher().whatsapp||'').replace(/\D/g,'');return /^\d{9,15}$/.test(n)?n:'';};
const scriptUrl=()=>{const u=String((AV&&AV.bookingUrl)||'');return BOOK_RE.test(u)?u:'';};
function renderHero(){const t=teacher(),name=String(t.name||'').slice(0,60);
 $('#t-name').textContent=name||'הזמנת שיעור';$('#t-av').textContent=name.trim()[0]||'·';
 if(t.bio)$('#t-bio').textContent=String(t.bio).slice(0,120);
 if(name)document.title='הזמנת שיעור · '+name;}
function freeDays(){const from=dkey(addDays(new Date(),1)),s=(AV&&AV.slots)||{},out=[];
 Object.keys(s).filter(d=>/^\d{4}-\d{2}-\d{2}$/.test(d)&&d>=from).sort().slice(0,24).forEach(d=>{const ts=(Array.isArray(s[d])?s[d]:[]).filter(t=>/^\d{2}:\d{2}$/.test(t)).sort();if(ts.length)out.push([d,ts]);});return out;}

function renderForm(keepForm){
 const days=freeDays(),wa=waNumber(),api=scriptUrl();
 if(!api&&!wa){$('#content').innerHTML='<div class="empty"><div class="big">ההזמנה המקוונת סגורה כרגע</div>אפשר לפנות למורה ישירות.</div>';return;}
 let me={};
 if(keepForm)me={name:$('#s-name')?.value,phone:$('#s-phone')?.value,lang:selLang,notes:$('#s-notes')?.value};
 else{try{me=JSON.parse(localStorage.getItem('cf_me')||'{}')||{};}catch(e){}}
 selDate='';selTime='';
 if(!days.length){$('#content').innerHTML=`<div class="empty"><div class="big">אין כרגע שעות פנויות</div>${wa?'אפשר לכתוב למורה ישירות.':'שעות חדשות נפתחות מדי שבוע.'}</div>${wa?`<a class="mbtn wa" href="https://wa.me/${wa}" target="_blank" rel="noopener">כתוב בוואטסאפ</a>`:''}`;return;}
 $('#content').innerHTML=`
  <section class="sec" id="st-lang"><h2>שפה</h2><div class="seg" id="s-lang">${LANGS.map(l=>`<button data-lang="${esc(l.name)}" aria-pressed="false">${esc(l.name)}</button>`).join('')}</div></section>
  <section class="sec" id="st-date"><h2>יום <small>${+AV.lessonDuration||60} דקות לשיעור</small></h2><div class="row">${days.map(([d])=>{const x=parseKey(d);return `<button class="date" data-date="${d}" aria-pressed="false"><span class="wd">${DAYS[x.getDay()]}</span><span class="dn">${x.getDate()}</span><span class="mo">${MONTHS[x.getMonth()].slice(0,3)}׳</span></button>`;}).join('')}</div></section>
  <section class="sec" id="st-time"><h2>שעה <small id="time-hint"></small></h2><div id="times"><p class="placeholder">בחר יום כדי לראות שעות</p></div></section>
  <section class="sec" id="st-me"><h2>הפרטים שלך</h2><div class="stack">
   <input class="inp" id="s-name" maxlength="60" autocomplete="name" value="${esc(me.name)}" placeholder="שם מלא" aria-label="שם מלא">
   <input class="inp" id="s-phone" type="tel" maxlength="20" autocomplete="tel" dir="ltr" style="text-align:right" value="${esc(me.phone)}" placeholder="טלפון לוואטסאפ" aria-label="טלפון לוואטסאפ">
   <textarea class="inp" id="s-notes" rows="2" maxlength="300" placeholder="הערה למורה (לא חובה)" aria-label="הערה למורה">${esc(me.notes||'')}</textarea>
  </div><input class="hp" id="s-web" tabindex="-1" autocomplete="off" aria-hidden="true"></section>
  <div class="sum" id="bar-txt"></div>
  <button class="send ${api?'':'wa'}" id="send">${api?'שלח בקשה':'שלח בוואטסאפ'}</button>`;
 if(me.lang&&LANG_CODE[me.lang])pickLang(me.lang);
 ['s-name','s-phone'].forEach(id=>$('#'+id).addEventListener('input',updateBar));
 updateBar();
}
function mark(id,done){const el=$('#'+id);if(el)el.classList.toggle('done',!!done);}
function updateBar(){
 const n=($('#s-name')?.value||'').trim().length>=2,p=($('#s-phone')?.value||'').replace(/\D/g,'').length>=9;
 mark('st-lang',selLang);mark('st-date',selDate);mark('st-time',selTime);mark('st-me',n&&p);
 const el=$('#bar-txt');if(!el)return;
 if(selDate&&selTime){const x=parseKey(selDate);el.innerHTML=`<b>${esc(selLang||'')}${selLang?' · ':''}יום ${DAYS[x.getDay()]} ${x.getDate()}/${x.getMonth()+1}, ${esc(selTime)}</b>`;}
 else el.textContent='';
}
function pickLang(l){selLang=l;document.querySelectorAll('[data-lang]').forEach(c=>{const on=c.dataset.lang===l;c.classList.toggle('on',on);c.setAttribute('aria-pressed',on);});updateBar();}
function pickDate(d){selDate=d;selTime='';document.querySelectorAll('[data-date]').forEach(b=>{const on=b.dataset.date===d;b.classList.toggle('on',on);b.setAttribute('aria-pressed',on);});
 const ts=(freeDays().find(x=>x[0]===d)||[,[]])[1],x=parseKey(d);
 $('#time-hint').textContent=`${ts.length} פנויות`;
 const groups=[['בוקר',t=>t<'12:00'],['צהריים',t=>t>='12:00'&&t<'16:00'],['אחר הצהריים וערב',t=>t>='16:00']].map(([h,f])=>[h,ts.filter(f)]).filter(g=>g[1].length);
 $('#times').innerHTML=`<div class="times">${ts.map(t=>`<button class="time" data-time="${t}" aria-pressed="false">${t}</button>`).join('')}</div>`;
 updateBar();
 }
function pickTime(t){selTime=t;document.querySelectorAll('[data-time]').forEach(b=>{const on=b.dataset.time===t;b.classList.toggle('on',on);b.setAttribute('aria-pressed',on);});updateBar();
 const n=$('#s-name');if(window.innerWidth<700&&n&&!n.value)$('#st-me').scrollIntoView({behavior:'smooth',block:'start'});}

function collect(){
 const clean=s=>String(s||'').replace(/\s+/g,' ').replace(/CF:/gi,'CF ').trim();
 const d={name:clean($('#s-name').value).slice(0,60),phone:$('#s-phone').value.trim().slice(0,20),notes:clean($('#s-notes').value).slice(0,300),lang:selLang,date:selDate,time:selTime};
 const fail=(m,id)=>{toast(m);const el=$('#'+id);if(el){el.scrollIntoView({behavior:'smooth',block:'center'});const f=el.querySelector('input,button')||el;if(f.focus)setTimeout(()=>f.focus({preventScroll:true}),300);}};
 if(!d.lang)return fail(ERR.bad_lang,'st-lang');
 if(!d.date)return fail('נא לבחור יום','st-date');
 if(!d.time)return fail('נא לבחור שעה','st-time');
 if(d.name.length<2)return fail(ERR.bad_name,'s-name');
 if(d.phone.replace(/\D/g,'').length<9)return fail(ERR.bad_phone,'s-phone');
 try{localStorage.setItem('cf_me',JSON.stringify({name:d.name,phone:d.phone,lang:d.lang}));}catch(e){}
 return d;
}
function waMessage(d){const t=teacher();return [`שלום${t.name?' '+String(t.name).slice(0,60):''}! אני רוצה לקבוע שיעור 🙂`,`שם: ${d.name}`,`טלפון: ${d.phone}`,`שפה: ${d.lang}`,`תאריך: ${dayLabel(d.date)}`,`שעה: ${d.time}`,...(d.notes?[`הערות: ${d.notes}`]:[]),'',`קוד: CF:${d.date}T${d.time}:${LANG_CODE[d.lang]}`].join('\n');}
const waUrl=d=>'https://wa.me/'+waNumber()+'?text='+encodeURIComponent(waMessage(d));
function modal(html){$('#modal').innerHTML=html;$('#ovl').classList.add('open');setTimeout(()=>{const b=$('#modal .mbtn');if(b)b.focus();},250);}
const ticket=d=>`<dl class="ticket"><dt>שם</dt><dd>${esc(d.name)}</dd><dt>שפה</dt><dd>${esc(d.lang)}</dd><dt>מתי</dt><dd>${esc(dayLabel(d.date))}, ${esc(d.time)}</dd></dl>`;
const CHECK='<svg viewBox="0 0 24 24" fill="none"><path d="M5 12.5l4.5 4.5L19 7.5" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>';

async function send(){
 if(sending)return;const d=collect();if(!d)return;
 const api=scriptUrl();
 if(!api){window.open(waUrl(d),'_blank','noopener');return modal(`<div class="badge ok">💬</div><h3>ההודעה מוכנה בוואטסאפ</h3><p>לחץ "שלח" בוואטסאפ כדי להעביר את הבקשה למורה.</p>${ticket(d)}<a class="mbtn wa" href="${esc(waUrl(d))}" target="_blank" rel="noopener">פתח שוב את וואטסאפ</a><button class="mbtn" data-act="close">סגור</button>`);}
 const btn=$('#send');sending=true;btn.disabled=true;btn.innerHTML='<span class="spin sm"></span> שולח…';
 const c=new AbortController(),timer=setTimeout(()=>c.abort(),20000);
 let res=null;
 try{const r=await fetch(api,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({...d,website:$('#s-web').value}),signal:c.signal});res=await r.json();}
 catch(e){res=null;}
 finally{clearTimeout(timer);sending=false;btn.disabled=false;btn.textContent='שלח בקשה';}
 if(res&&res.ok){
  if(AV.slots&&AV.slots[d.date])AV.slots[d.date]=AV.slots[d.date].filter(t=>t!==d.time);
  renderForm(true);$('#s-notes').value='';
  return modal(`<div class="badge ok">${CHECK}</div><h3>הבקשה נשלחה</h3><p>המורה יאשר את השיעור בהודעת וואטסאפ למספר ${esc(d.phone)}.</p>${ticket(d)}<button class="mbtn pri" data-act="close">סגור</button>`);
 }
 if(res&&(res.error==='slot_unavailable'||res.error==='slot_pending')){toast(ERR[res.error]);return load(true);}
 if(res&&ERR[res.error])return toast(ERR[res.error]);
 const wa=waNumber();
 modal(`<div class="badge err">⚠️</div><h3>השליחה לא הצליחה</h3><p>החיבור נכשל.${wa?' אפשר לשלוח את אותה בקשה בוואטסאפ, או לנסות שוב.':' נסה שוב בעוד רגע.'}</p>${ticket(d)}
  ${wa?`<a class="mbtn wa" href="${esc(waUrl(d))}" target="_blank" rel="noopener">שלח בוואטסאפ</a>`:''}<button class="mbtn" data-act="retry">נסה שוב</button><button class="mbtn" data-act="close">סגור</button>`);
}
document.addEventListener('click',e=>{
 const l=e.target.closest('[data-lang]');if(l)return pickLang(l.dataset.lang);
 const d=e.target.closest('[data-date]');if(d)return pickDate(d.dataset.date);
 const t=e.target.closest('[data-time]');if(t)return pickTime(t.dataset.time);
 if(e.target.closest('#send'))return send();
 const a=e.target.closest('[data-act]');
 if(a&&a.dataset.act==='retry'){$('#ovl').classList.remove('open');return send();}
 if((a&&a.dataset.act==='close')||e.target.id==='ovl')$('#ovl').classList.remove('open');
});
document.addEventListener('keydown',e=>{if(e.key==='Escape')$('#ovl').classList.remove('open');});
load();
</script>
</body>
</html>
